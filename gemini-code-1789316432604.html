<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay Chirag Maru</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #0f172a; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 20px; text-align: center;
    }
    .card {
      background: #1e293b; padding: 32px 24px; border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 360px;
    }
    .avatar {
      width: 64px; height: 64px; background: #3b82f6; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: bold; margin: 0 auto 16px;
    }
    h2 { margin: 0 0 4px; font-size: 1.3rem; }
    .vpa { color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; }
    .btn {
      display: block; width: 100%; padding: 16px; border-radius: 14px;
      font-size: 1.05rem; font-weight: 600; text-decoration: none;
      background: #2563eb; color: #fff; transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.85; }
    .note { margin-top: 16px; font-size: 0.8rem; color: #64748b; }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">CM</div>
    <h2>Chirag Maru</h2>
    <div class="vpa">chiragmaru085@okaxis</div>

    <!-- The direct user gesture required by iOS Safari -->
    <a href="upi://pay?pa=chiragmaru085@okaxis&pn=Chirag%20Maru&cu=INR" class="btn" id="payBtn">
      Pay with UPI App
    </a>

    <div class="note">Opens GPay, PhonePe, Paytm, or BHIM</div>
  </div>

  <script>
    // Attempts instant launch on Android; iOS gracefully falls back to the Pay button
    window.onload = function() {
      if (!/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        window.location.href = "upi://pay?pa=chiragmaru085@okaxis&pn=Chirag%20Maru&cu=INR";
      }
    };
  </script>

</body>
</html>
