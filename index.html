<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pay Dhairya</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #151c2e;
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .avatar {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      margin: 0 auto 16px;
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
    }
    h2 {
      margin: 0 0 4px;
      font-size: 1.4rem;
      letter-spacing: -0.5px;
    }
    .vpa {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 24px;
      background: #0f172a;
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #1e293b;
    }
    .input-box {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 14px;
      padding: 10px 16px;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .input-box:focus-within {
      border-color: #3b82f6;
    }
    .currency-symbol {
      font-size: 1.5rem;
      font-weight: 700;
      color: #94a3b8;
      margin-right: 8px;
    }
    input[type="number"] {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1.5rem;
      font-weight: 700;
      width: 100%;
    }
    .chips {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
      justify-content: center;
    }
    .chip {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
    }
    .chip:active {
      background: #3b82f6;
      color: #fff;
    }
    .pay-btn {
      width: 100%;
      padding: 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: opacity 0.2s;
    }
    .pay-btn:active {
      opacity: 0.85;
    }
    .subtext {
      margin-top: 18px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">D</div>
    <h2>Dhairya</h2>
    <div class="vpa">whydhairya@fam</div>

    <form id="paymentForm">
      <div class="input-box">
        <span class="currency-symbol">₹</span>
        <input 
          type="number" 
          id="amount" 
          placeholder="Enter amount" 
          min="1" 
          step="any" 
          inputmode="decimal"
        />
      </div>

      <div class="chips">
        <button type="button" class="chip" onclick="setAmount(50)">₹50</button>
        <button type="button" class="chip" onclick="setAmount(100)">₹100</button>
        <button type="button" class="chip" onclick="setAmount(200)">₹200</button>
        <button type="button" class="chip" onclick="setAmount(500)">₹500</button>
      </div>

      <button type="submit" class="pay-btn">Pay with UPI</button>
    </form>

    <div class="subtext">Supports GPay, PhonePe, Paytm & BHIM</div>
  </div>

  <script>
    const UPI_ID = "whydhairya@fam";
    const PAYEE_NAME = "Dhairya";

    function setAmount(val) {
      document.getElementById("amount").value = val;
    }

    document.getElementById("paymentForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const amtInput = document.getElementById("amount").value.trim();
      let upiUrl = `upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(PAYEE_NAME)}&cu=INR`;

      if (amtInput) {
        const parsed = parseFloat(amtInput);
        if (parsed > 0) {
          upiUrl += `&am=${parsed.toFixed(2)}`;
        }
      }

      // Triggers native UPI intent on both iOS Safari and Android
      window.location.href = upiUrl;
    });
  </script>

</body>
</html>
